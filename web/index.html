<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>WhatsApp Print</title>
<script src="https://cdn.jsdelivr.net/npm/modern-screenshot@4.6.0/dist/index.js"></script>
<style>
:root{
  --bg:#0c0f11; --panel:#14181b; --card:#1a1f23; --line:#2c343a;
  --text:#eef3f6; --muted:#8a959c; --accent:#25d366; --blue:#53bdeb; --danger:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;height:100vh;overflow:hidden}
button,input,select,textarea{font:inherit;color:var(--text)}
button{cursor:pointer}

.panel{background:var(--panel);overflow:auto;min-height:0}
.left{border-right:1px solid var(--line);padding:12px}
.right{border-left:1px solid var(--line);padding:12px;display:flex;flex-direction:column;min-height:0}
.center{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:16px 12px;min-width:0;min-height:0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,#182028,var(--bg) 60%);
}

h1{font-size:14px;margin:0 0 2px;font-weight:650}
.sub{color:var(--muted);font-size:11px;margin:0 0 12px;line-height:1.35}
h2{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;font-weight:700}
.right>h2{margin-top:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.right>h2 .tools{display:flex;gap:4px}

.ex{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.ex button{appearance:none;border:1px solid var(--line);background:#101416;border-radius:10px;padding:5px;color:var(--text)}
.ex button.on{border-color:#2f5a40;background:#17241c}
.ex img{width:100%;aspect-ratio:390/844;object-fit:cover;border-radius:6px;display:block;background:#000}
.ex span{display:block;margin-top:4px;font-size:11px;color:var(--muted)}

.field{margin:0 0 8px}
.field label{display:block;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:650}
.field input,.field textarea,.field select{
  width:100%;background:#0e1214;border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;font-size:12px;line-height:1.3}
.field textarea{min-height:52px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{
  outline:none;border-color:#3d8f5f;box-shadow:0 0 0 2px rgba(37,211,102,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.bat{display:flex;align-items:center;gap:8px}
.bat input[type=range]{flex:1;accent-color:var(--accent);height:18px}
.bat .pct{min-width:34px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}

.actions{display:grid;gap:6px;margin-top:10px}
.btn{appearance:none;border:1px solid var(--line);background:#1c2226;border-radius:9px;padding:8px 10px;font-size:12px}
.btn.primary{background:var(--accent);color:#04210f;border-color:transparent;font-weight:700}
.btn.sm{padding:4px 8px;font-size:11px;border-radius:7px;line-height:1.2}
.btn.danger{color:var(--danger);border-color:#4a2a2a;background:#1a1212}
.btn.icon{width:28px;height:28px;padding:0;display:inline-grid;place-items:center;font-size:14px;font-weight:700}

.download-bar{display:flex;gap:8px;align-items:center;justify-content:center}
.btn-dl{
  appearance:none;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:#1a2226;color:var(--text);
  border-radius:999px;padding:7px 14px 7px 12px;font-size:12px;font-weight:600;
  box-shadow:0 6px 18px rgba(0,0,0,.28);
}
.btn-dl:hover{border-color:#3d8f5f;background:#17241c}
.btn-dl.ghost:hover{border-color:#4a6a88;background:#152028}
.btn-dl svg{display:block;flex-shrink:0;opacity:.9}

.stage-wrap{
  position:relative;
  flex:0 0 auto;
  width:260px;height:562px; /* fallback; JS seta o size real */
  overflow:hidden;
  border-radius:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.5);
  background:#000;
}
#stage{
  width:390px;height:844px;overflow:hidden;background:#000;
  transform-origin:0 0;
  position:absolute;inset:0 auto auto 0;
  will-change:transform;
}
.hint,.status{color:var(--muted);font-size:11px;text-align:center;max-width:280px}
.status.ok{color:var(--accent)}.status.err{color:#ff6b6b}

#msgs{flex:1;overflow:auto;min-height:0;padding-bottom:8px}
.msg{
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin:0 0 7px;
  display:grid;gap:6px;cursor:grab;touch-action:none;
}
.msg.dragging{opacity:.45;cursor:grabbing}
.msg.drag-over{border-color:var(--accent);box-shadow:0 0 0 1px rgba(37,211,102,.35)}
.msg-head{display:flex;justify-content:space-between;align-items:center;gap:6px}
.msg-head .leftish{display:flex;align-items:center;gap:6px;min-width:0}
.handle{color:var(--muted);font-size:12px;letter-spacing:-1px;user-select:none;cursor:grab;padding:0 2px}
.badge{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:999px;background:#22282d;color:var(--muted)}
.badge.in{background:rgba(61,139,253,.14);color:#9ec5ff}
.badge.out{background:rgba(37,211,102,.14);color:#7dffa8}
.badge.date{background:rgba(255,255,255,.06);color:#c7ced3}
.idx{color:var(--muted);font-size:10px}
.msg .field{margin:0}
.msg .field input,.msg .field textarea,.msg .field select{padding:6px 8px;font-size:11px;border-radius:7px}
.msg .field textarea{min-height:44px}
.msg .field label{font-size:9px;margin-bottom:3px}
#file{display:none}

@media(max-width:980px){
  body{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;height:auto;overflow:auto}
  .left,.right{border:0;max-height:none}
  .stage-wrap{width:min(240px,70vw);max-height:none}
  #stage{position:relative}
}
</style>
</head>
<body>
<aside class="panel left">
  <h1>WhatsApp Print</h1>
  <p class="sub">100% browser. Sem servidor.</p>

  <div class="ex">
    <button type="button" id="exEscuro" class="on"><img id="thumbEscuro" alt=""><span>Escuro</span></button>
    <button type="button" id="exClaro"><img id="thumbClaro" alt=""><span>Claro</span></button>
  </div>

  <h2>Config</h2>
  <div class="field"><label>Tema</label>
    <select id="tema"><option value="escuro">Escuro</option><option value="claro">Claro</option></select>
  </div>
  <div class="field"><label>Contato</label><input id="contato" placeholder="Nome"></div>
  <div class="field"><label>Hora</label><input id="horaStatus" placeholder="16:48"></div>
  <div class="field"><label>Bateria</label>
    <div class="bat">
      <input id="bateria" type="range" min="0" max="100" value="80">
      <span class="pct" id="batPct">80%</span>
    </div>
  </div>
  <div class="field"><label>Foto (URL)</label><input id="foto" placeholder="https://… ou clique no avatar"></div>

  <div class="actions">
    <button class="btn" type="button" id="addMsg">+ mensagem</button>
    <button class="btn" type="button" id="addData">+ data</button>
  </div>
  <p class="status" id="status" style="margin-top:10px;text-align:left"></p>
</aside>

<main class="center">
  <div class="download-bar">
    <button class="btn-dl" type="button" id="gerar" title="Baixar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 19h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      Baixar
    </button>
    <button class="btn-dl ghost" type="button" id="aleatorio" title="Aleatório">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M16 3h5v5M8 3H3v5M21 3l-7.5 7.5M3 3l7.5 7.5M16 21h5v-5M8 21H3v-5M21 21l-7.5-7.5M3 21l7.5-7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Aleatório
    </button>
  </div>
  <div class="stage-wrap"><div id="stage"><div id="phone-host"></div></div></div>
  <p class="hint">Clique no texto/foto do celular pra editar</p>
</main>

<aside class="panel right">
  <h2>
    <span>Chats</span>
    <span class="tools">
      <button class="btn sm icon" type="button" id="addMsgSide" title="Adicionar mensagem">+</button>
      <button class="btn sm" type="button" id="addDataSide" title="Adicionar data">data</button>
    </span>
  </h2>
  <div id="msgs"></div>
</aside>

<input id="file" type="file" accept="image/*">

<script type="module">
import { EXAMPLES, renderPhone } from './phone.mjs';
import { randomConversation, randomFoto, randomNome } from './shuffle.mjs';

const state = { data: structuredClone(EXAMPLES.escuro), uploadPath: null, dragFrom: null, avatars: { homem: [], mulher: [] } };
const $ = (s) => document.querySelector(s);
const status = (m, ok) => { const el=$('#status'); el.textContent=m||''; el.className='status '+(ok===true?'ok':ok===false?'err':''); };

$('#thumbEscuro').src = 'examples/escuro.png';
$('#thumbClaro').src = 'examples/claro.png';

fetch('avatars/manifest.json')
  .then((r) => r.json())
  .then((m) => { state.avatars = m; })
  .catch(() => status('Avatares não carregaram', false));

function fitPhone() {
  const wrap = document.querySelector('.stage-wrap');
  const stage = $('#stage');
  const center = document.querySelector('.center');
  if (!wrap || !stage || !center) return;
  // reserva espaço pro botão Baixar + hint
  const chrome = 96;
  const availW = Math.max(160, center.clientWidth - 24);
  const availH = Math.max(220, center.clientHeight - chrome);
  const s = Math.min(availW / 390, availH / 844, 1);
  const w = Math.round(390 * s);
  const h = Math.round(844 * s);
  wrap.style.width = `${w}px`;
  wrap.style.height = `${h}px`;
  stage.style.transform = `scale(${s})`;
}

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));}

function syncForm() {
  const d = state.data;
  $('#tema').value = d.tema === 'claro' ? 'claro' : 'escuro';
  $('#contato').value = d.contato || '';
  $('#horaStatus').value = d.horaStatus || '';
  $('#bateria').value = d.bateria ?? 80;
  $('#batPct').textContent = `${$('#bateria').value}%`;
  $('#foto').value = d.foto || '';
  $('#msgs').innerHTML = (d.mensagens||[]).map((m,i)=>{
    if (m.tipo==='data') return `<article class="msg" draggable="true" data-i="${i}">
      <div class="msg-head">
        <div class="leftish"><span class="handle" title="Arrastar">⠿</span><span class="badge date">Data</span><span class="idx">#${i+1}</span></div>
        <button class="btn sm danger" type="button" data-del="${i}" title="Remover">✕</button>
      </div>
      <div class="field"><label>Texto</label><input data-k="texto" value="${esc(m.texto||'')}"></div>
    </article>`;
    const mine = m.de==='eu';
    return `<article class="msg" draggable="true" data-i="${i}">
      <div class="msg-head">
        <div class="leftish"><span class="handle" title="Arrastar">⠿</span><span class="badge ${mine?'out':'in'}">${mine?'Enviada':'Recebida'}</span><span class="idx">#${i+1}</span></div>
        <button class="btn sm danger" type="button" data-del="${i}" title="Remover">✕</button>
      </div>
      <div class="row2">
        <div class="field"><label>De</label>
          <select data-k="de"><option value="ela" ${!mine?'selected':''}>Contato</option><option value="eu" ${mine?'selected':''}>Você</option></select>
        </div>
        <div class="field"><label>Hora</label><input data-k="hora" value="${esc(m.hora||'')}"></div>
      </div>
      <div class="field"><label>Texto</label><textarea data-k="texto">${esc(m.texto||'')}</textarea></div>
      <div class="field"><label>Imagem</label><input data-k="imagem" value="${esc(m.imagem||'')}" placeholder="opcional"></div>
    </article>`;
  }).join('');

  $('#msgs').querySelectorAll('.msg').forEach(card=>{
    card.querySelectorAll('[data-k]').forEach(inp=>{
      const go=()=>{
        const i=+card.dataset.i, k=inp.dataset.k;
        state.data.mensagens[i][k]=inp.value;
        if(k==='de'){ if(inp.value==='eu') state.data.mensagens[i].status='lido'; else delete state.data.mensagens[i].status; syncForm(); }
        paint();
      };
      inp.addEventListener('change', go);
      if(inp.tagName==='TEXTAREA') inp.addEventListener('blur', go);
      // avoid starting drag when editing fields
      inp.addEventListener('mousedown', e => e.stopPropagation());
      inp.addEventListener('pointerdown', e => e.stopPropagation());
    });

    card.addEventListener('dragstart', (e)=>{
      if (e.target.closest('input,textarea,select,button')) { e.preventDefault(); return; }
      state.dragFrom = +card.dataset.i;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(state.dragFrom));
    });
    card.addEventListener('dragend', ()=>{
      state.dragFrom = null;
      $('#msgs').querySelectorAll('.msg').forEach(el=>el.classList.remove('dragging','drag-over'));
    });
    card.addEventListener('dragover', (e)=>{
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', ()=> card.classList.remove('drag-over'));
    card.addEventListener('drop', (e)=>{
      e.preventDefault();
      card.classList.remove('drag-over');
      const from = state.dragFrom ?? Number(e.dataTransfer.getData('text/plain'));
      const to = +card.dataset.i;
      if (!Number.isInteger(from) || from === to) return;
      const list = state.data.mensagens;
      const [item] = list.splice(from, 1);
      list.splice(to, 0, item);
      syncForm(); paint();
    });
  });

  $('#msgs').querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.preventDefault(); e.stopPropagation();
      const i = +btn.dataset.del;
      state.data.mensagens.splice(i, 1);
      syncForm(); paint();
    });
  });
}

function pull(){
  state.data.tema=$('#tema').value;
  state.data.contato=$('#contato').value;
  state.data.horaStatus=$('#horaStatus').value;
  state.data.bateria=Number($('#bateria').value||80);
  state.data.foto=$('#foto').value;
}

function paint(){
  pull();
  $('#phone-host').innerHTML = renderPhone({ ...state.data, editavel:true });
  $('#exEscuro').classList.toggle('on', state.data.tema==='escuro');
  $('#exClaro').classList.toggle('on', state.data.tema==='claro');
  requestAnimationFrame(fitPhone);
}

function setPath(obj, path, value){
  const parts=path.split('.'); let cur=obj;
  for(let i=0;i<parts.length-1;i++){ const key=Number.isNaN(Number(parts[i]))?parts[i]:Number(parts[i]); cur=cur[key]; }
  const last=parts.at(-1); cur[Number.isNaN(Number(last))?last:Number(last)]=value;
}

function addMsg(){ state.data.mensagens.push({de:'ela',texto:'nova mensagem',hora:'12:00'}); syncForm(); paint(); }
function addData(){ state.data.mensagens.push({tipo:'data',texto:'hoje'}); syncForm(); paint(); }

document.addEventListener('focusout',(e)=>{
  const el=e.target.closest?.('[data-edit]'); if(!el) return;
  setPath(state.data, el.dataset.edit, el.innerText); syncForm();
});
document.addEventListener('click',(e)=>{
  const shuff=e.target.closest?.('[data-shuffle]');
  if(shuff){
    e.preventDefault(); e.stopPropagation();
    const kind=shuff.dataset.shuffle;
    if(kind==='foto'){
      if(!(state.avatars.mulher?.length||state.avatars.homem?.length)){ status('Avatares ainda carregando…', false); return; }
      state.data.foto=randomFoto({ avatars:state.avatars, foto:state.data.foto, contato:state.data.contato });
      syncForm(); paint(); status('Foto trocada', true);
      return;
    }
    if(kind==='nome'){
      state.data.contato=randomNome({ foto:state.data.foto, contato:state.data.contato });
      syncForm(); paint(); status('Nome trocado', true);
      return;
    }
  }
  const el=e.target.closest?.('[data-upload]'); if(!el) return;
  if(e.target.closest?.('[data-shuffle]')) return;
  e.preventDefault(); state.uploadPath=el.dataset.upload; $('#file').click();
});

$('#file').addEventListener('change', async ()=>{
  const file=$('#file').files?.[0]; if(!file||!state.uploadPath) return;
  const dataUrl=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); });
  setPath(state.data, state.uploadPath, dataUrl);
  if(state.uploadPath==='foto') $('#foto').value=dataUrl;
  state.uploadPath=null; $('#file').value=''; syncForm(); paint(); status('Imagem ok', true);
});

$('#bateria').addEventListener('input', ()=>{ $('#batPct').textContent=`${$('#bateria').value}%`; pull(); paint(); });
['tema','contato','horaStatus','foto'].forEach(id=>$(`#${id}`).addEventListener('change',()=>{ pull(); paint(); }));
$('#exEscuro').onclick=()=>{ state.data=structuredClone(EXAMPLES.escuro); syncForm(); paint(); };
$('#exClaro').onclick=()=>{ state.data=structuredClone(EXAMPLES.claro); syncForm(); paint(); };
$('#addMsg').onclick=addMsg;
$('#addData').onclick=addData;
$('#addMsgSide').onclick=addMsg;
$('#addDataSide').onclick=addData;

$('#aleatorio').onclick=()=>{
  const tema = $('#tema').value || state.data.tema || 'escuro';
  if (!(state.avatars.mulher?.length || state.avatars.homem?.length)) {
    status('Avatares ainda carregando…', false);
    return;
  }
  state.data = randomConversation({ tema, avatars: state.avatars });
  syncForm(); paint();
  status('Aleatório ok', true);
};

$('#gerar').onclick=async ()=>{
  try{
    pull(); paint(); status('Gerando…');
    const node=document.querySelector('#phone'); if(!node) throw new Error('preview vazio');
    node.querySelectorAll('[data-edit],[data-upload]').forEach(el=>{ el.removeAttribute('contenteditable'); el.style.outline='none'; });
    node.querySelectorAll('.shuff').forEach(el=>el.remove());
    const dataUrl=await modernScreenshot.domToPng(node,{ width:390, height:844, scale:3 });
    const a=document.createElement('a');
    a.href=dataUrl; a.download=`${(state.data.contato||'print').replace(/\s+/g,'-').toLowerCase()}.png`;
    a.rel='noopener'; a.click();
    status('Baixado', true); paint();
  }catch(e){ status(String(e.message||e), false); }
};

window.addEventListener('resize', fitPhone);
syncForm(); paint();
</script>
</body>
</html>
