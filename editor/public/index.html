<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>WhatsApp Print — Editor</title>
<style>
:root {
  --bg: #0c0f11;
  --panel: #14181b;
  --card: #1a1f23;
  --line: #2c343a;
  --text: #f2f5f7;
  --muted: #8a959c;
  --accent: #25d366;
  --blue: #53bdeb;
  --in: #3d8bfd;
  --out: #25d366;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  display: grid; grid-template-columns: 260px minmax(0,1fr) 380px; min-height: 100vh;
}
button, input, select, textarea { font: inherit; color: var(--text); }
button { cursor: pointer; }

/* left */
aside {
  background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 100vh;
}
.bar { padding: 18px 16px 14px; border-bottom: 1px solid var(--line); }
.bar h1 { margin: 0 0 4px; font-size: 15px; font-weight: 650; }
.bar p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.35; }
#list { overflow: auto; flex: 1; padding: 10px; }
.item {
  display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center;
  padding: 8px; border-radius: 14px; cursor: pointer; border: 1px solid transparent;
}
.item:hover { background: #1c2226; }
.item.on { background: #17241c; border-color: #2f5a40; }
.item img, .item .ph {
  width: 52px; height: 52px; border-radius: 12px; object-fit: cover; background: #0a0c0d;
}
.item .ph { display: grid; place-items: center; color: var(--muted); font-size: 11px; }
.item b { display: block; font-size: 13px; font-weight: 600; }
.item span { color: var(--muted); font-size: 11px; }

/* center */
main {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 20px;
  background: radial-gradient(ellipse at 50% 0%, #182028, var(--bg) 55%);
}
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.toolbar label { font-size: 12px; color: var(--muted); }
.toolbar select, .toolbar button {
  background: #1c2226; border: 1px solid var(--line); border-radius: 11px; padding: 9px 13px; font-size: 13px;
}
.toolbar button.primary { background: var(--accent); color: #04210f; border-color: transparent; font-weight: 700; }
#frame-wrap {
  width: 390px; height: 844px; border-radius: 28px; overflow: hidden; background: #000;
  box-shadow: 0 30px 80px rgba(0,0,0,.55);
}
#frame { width: 390px; height: 844px; border: 0; display: block; }
.hint { color: var(--muted); font-size: 12px; text-align: center; max-width: 420px; line-height: 1.4; }
#status { font-size: 12px; color: var(--muted); min-height: 16px; }
#status.ok { color: var(--accent); } #status.err { color: #ff6b6b; }

/* right panel */
.side {
  background: var(--panel); border-left: 1px solid var(--line);
  padding: 16px; overflow: auto; min-height: 100vh;
}
.side h2 {
  margin: 0 0 12px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); font-weight: 700;
}
.side h2 + .stack { margin-bottom: 8px; }
.stack { display: grid; gap: 10px; margin-bottom: 18px; }
.field label {
  display: block; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 6px; font-weight: 650;
}
.field input, .field textarea, .field select {
  width: 100%; background: #0e1214; border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 13px; font-size: 14px; line-height: 1.4;
}
.field textarea { min-height: 92px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none; border-color: #3d8f5f; box-shadow: 0 0 0 3px rgba(37,211,102,.14);
}
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.msg {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 12px; display: grid; gap: 10px; margin-bottom: 10px;
}
.msg-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
  padding: 5px 9px; border-radius: 999px; background: #22282d; color: var(--muted);
}
.badge.in { background: rgba(61,139,253,.14); color: #9ec5ff; }
.badge.out { background: rgba(37,211,102,.14); color: #7dffa8; }
.badge.date { background: rgba(255,255,255,.06); color: #c7ced3; }
.msg-head .idx { color: var(--muted); font-size: 11px; }
.msg .field { margin: 0; }
.msg .tiny { font-size: 13px; padding: 10px 12px; }
#filePick { display: none; }

@media (max-width: 1100px) {
  body { grid-template-columns: 220px 1fr; }
  .side { display: none; }
}
</style>
</head>
<body>
<aside>
  <header class="bar">
    <h1>WhatsApp Print</h1>
    <p>Escolha um print. Edite no celular ou no painel.</p>
  </header>
  <div id="list"></div>
</aside>

<main>
  <div class="toolbar">
    <label>Tema</label>
    <select id="tema">
      <option value="escuro">Escuro</option>
      <option value="claro">Claro</option>
    </select>
    <button type="button" id="btnPreview">Atualizar</button>
    <button class="primary" type="button" id="btnSave">Salvar + gerar PNG</button>
    <button type="button" id="btnBoth">Gerar claro e escuro</button>
  </div>
  <div id="frame-wrap"><iframe id="frame" title="Preview"></iframe></div>
  <p class="hint">Clique no texto do celular pra editar · clique na foto/imagem pra trocar</p>
  <div id="status"></div>
</main>

<section class="side">
  <h2>Conversa</h2>
  <div class="stack">
    <div class="field"><label>Nome do contato</label><input id="contato" placeholder="Ex.: Rafaela D."></div>
    <div class="row2">
      <div class="field"><label>Hora do status</label><input id="horaStatus" placeholder="16:48"></div>
      <div class="field"><label>Bateria %</label><input id="bateria" type="number" min="0" max="100"></div>
    </div>
    <div class="field"><label>Foto (caminho ou URL)</label><input id="foto" placeholder="/caminho/foto.webp"></div>
  </div>

  <h2>Mensagens</h2>
  <div id="msgs"></div>
</section>

<input id="filePick" type="file" accept="image/*">

<script>
const state = { id: null, data: null, uploadPath: null };
const $ = (s) => document.querySelector(s);
const status = (msg, ok) => {
  const el = $("#status");
  el.textContent = msg || "";
  el.className = ok === true ? "ok" : ok === false ? "err" : "";
};

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
    ...opts,
  });
  const text = await res.text();
  let data; try { data = JSON.parse(text); } catch { data = { raw: text }; }
  if (!res.ok) throw new Error(data.error || text || res.statusText);
  return data;
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

async function loadList() {
  const { items } = await api("/api/list");
  $("#list").innerHTML = items.map((it) => `
    <div class="item ${state.id === it.id ? "on" : ""}" data-id="${it.id}">
      ${it.thumb ? `<img src="${it.thumb}" alt="">` : `<div class="ph">PNG</div>`}
      <div><b>${escapeHtml(it.contato)}</b><span>${it.id} · ${it.msgs} msgs</span></div>
    </div>`).join("");
  $("#list").querySelectorAll(".item").forEach((el) => {
    el.addEventListener("click", () => openConversa(el.dataset.id));
  });
}

async function openConversa(id) {
  const { data } = await api("/api/conversa/" + encodeURIComponent(id));
  state.id = id; state.data = data;
  syncForm(); await refreshPreview(); loadList();
  status(`Abriu ${id}`, true);
}

function syncForm() {
  const d = state.data;
  $("#contato").value = d.contato || "";
  $("#horaStatus").value = d.horaStatus || "";
  $("#bateria").value = d.bateria ?? "";
  $("#foto").value = d.foto || "";
  $("#tema").value = d.tema === "claro" ? "claro" : "escuro";

  $("#msgs").innerHTML = (d.mensagens || []).map((m, i) => {
    if (m.tipo === "data") {
      return `<article class="msg" data-i="${i}">
        <div class="msg-head"><span class="badge date">Separador de data</span><span class="idx">#${i + 1}</span></div>
        <div class="field"><label>Texto da data</label>
          <input class="tiny" data-k="texto" value="${escapeHtml(m.texto || "")}" placeholder="2 de nov. de 2026">
        </div>
      </article>`;
    }
    const mine = m.de === "eu";
    return `<article class="msg" data-i="${i}">
      <div class="msg-head">
        <span class="badge ${mine ? "out" : "in"}">${mine ? "Enviada (verde)" : "Recebida (cinza)"}</span>
        <span class="idx">#${i + 1}</span>
      </div>
      <div class="row2">
        <div class="field"><label>Quem fala</label>
          <select data-k="de">
            <option value="ela" ${!mine ? "selected" : ""}>Contato</option>
            <option value="eu" ${mine ? "selected" : ""}>Você (Joyce)</option>
          </select>
        </div>
        <div class="field"><label>Horário</label>
          <input class="tiny" data-k="hora" value="${escapeHtml(m.hora || "")}" placeholder="09:14">
        </div>
      </div>
      <div class="field"><label>Mensagem</label>
        <textarea data-k="texto" placeholder="Escreva a mensagem…">${escapeHtml(m.texto || "")}</textarea>
      </div>
      <div class="field"><label>Imagem anexada (opcional)</label>
        <input class="tiny" data-k="imagem" value="${escapeHtml(m.imagem || "")}" placeholder="caminho ou URL">
      </div>
    </article>`;
  }).join("");

  $("#msgs").querySelectorAll(".msg").forEach((card) => {
    card.querySelectorAll("[data-k]").forEach((inp) => {
      const apply = () => {
        const i = Number(card.dataset.i);
        const k = inp.dataset.k;
        state.data.mensagens[i][k] = inp.value;
        if (k === "de") {
          if (inp.value === "eu") state.data.mensagens[i].status = "lido";
          else delete state.data.mensagens[i].status;
          syncForm();
        }
        refreshPreview();
      };
      inp.addEventListener("change", apply);
      if (inp.tagName === "TEXTAREA") inp.addEventListener("blur", apply);
    });
  });
}

function pullForm() {
  if (!state.data) return;
  state.data.contato = $("#contato").value;
  state.data.horaStatus = $("#horaStatus").value;
  state.data.bateria = Number($("#bateria").value);
  state.data.foto = $("#foto").value;
  state.data.tema = $("#tema").value;
}

async function refreshPreview() {
  if (!state.data) return;
  pullForm();
  const html = await fetch("/api/preview", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(state.data),
  }).then((r) => r.text());
  const doc = $("#frame").contentDocument;
  doc.open(); doc.write(html); doc.close();
}

function setByPath(obj, path, value) {
  const parts = path.split(".");
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    const key = Number.isNaN(Number(parts[i])) ? parts[i] : Number(parts[i]);
    cur = cur[key];
  }
  const last = parts.at(-1);
  cur[Number.isNaN(Number(last)) ? last : Number(last)] = value;
}

window.addEventListener("message", (ev) => {
  const msg = ev.data;
  if (!msg || msg.source !== "wa-print" || !state.data) return;
  if (msg.type === "edit") { setByPath(state.data, msg.path, msg.value); syncForm(); }
  if (msg.type === "upload") { state.uploadPath = msg.path; $("#filePick").click(); }
});

$("#filePick").addEventListener("change", async () => {
  const file = $("#filePick").files?.[0];
  if (!file || !state.uploadPath || !state.data) return;
  const dataUrl = await new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
  status("Enviando foto…");
  const up = await api("/api/upload", { method: "POST", body: JSON.stringify({ dataUrl, name: file.name }) });
  setByPath(state.data, state.uploadPath, up.path);
  if (state.uploadPath === "foto") $("#foto").value = up.path;
  state.uploadPath = null; $("#filePick").value = "";
  syncForm(); await refreshPreview(); status("Foto atualizada", true);
});

["contato", "horaStatus", "bateria", "foto"].forEach((id) => {
  $(`#${id}`).addEventListener("change", () => { pullForm(); refreshPreview(); });
});
$("#tema").addEventListener("change", () => { pullForm(); refreshPreview(); });
$("#btnPreview").addEventListener("click", () => refreshPreview());

$("#btnSave").addEventListener("click", async () => {
  try {
    pullForm(); status("Gerando PNG…");
    const out = await api("/api/gerar", { method: "POST", body: JSON.stringify({ id: state.id, data: state.data }) });
    status(`Salvo: ${out.path}`, true);
    if (out.thumb) window.open(out.thumb, "_blank");
    loadList();
  } catch (e) { status(String(e.message || e), false); }
});

$("#btnBoth").addEventListener("click", async () => {
  try {
    pullForm(); status("Gerando claro + escuro…");
    const out = await api("/api/gerar-ambos", { method: "POST", body: JSON.stringify({ id: state.id, data: state.data }) });
    status("Gerou claro e escuro", true);
    const tema = state.data?.tema === "claro" ? "claro" : "escuro";
    const url = out.thumbs?.[tema] || out.thumbs?.escuro || out.thumbs?.claro;
    if (url) window.open(url, "_blank");
    loadList();
  } catch (e) { status(String(e.message || e), false); }
});

(async () => {
  await loadList();
  const first = document.querySelector("#list .item");
  if (first) openConversa(first.dataset.id);
})();
</script>
</body>
</html>
